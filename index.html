<?php
// api.php
header('Content-Type: application/json');
$db_file = __DIR__ . '/orders.json';

if (!file_exists($db_file)) {
    file_put_contents($db_file, json_encode([]));
}

$method = $_SERVER['REQUEST_METHOD'];
$orders = json_decode(file_get_contents($db_file), true);

if ($method === 'GET') {
    echo json_encode($orders);
    exit;
}

if ($method === 'POST') {
    $data = json_decode(file_get_contents('php://input'), true);
    $orderNumber = str_pad(count($orders) + 1, 2, '0', STR_PAD_LEFT);
    $newOrder = [
        'id' => (string)time(),
        'orderNumber' => $orderNumber,
        'items' => $data['items'],
        'total' => $data['total'],
        'status' => '製作中',
        'time' => date('H:i:s')
    ];
    $orders[] = $newOrder;
    file_put_contents($db_file, json_encode($orders, JSON_PRETTY_PRINT));
    echo json_encode($newOrder);
    exit;
}
?>
