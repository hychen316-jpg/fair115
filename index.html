<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>115 精神醫療中心・炒豆花科 | 雲端即時門診系統</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Firebase 雲端即時資料庫 (跨手機同步必備) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Share+Tech+Mono&display=swap');
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #f1f5f9;
    }
    .font-mono-num {
      font-family: 'Share Tech Mono', monospace;
    }
    .stamp-unpaid {
      border: 3px dashed #ef4444;
      color: #ef4444;
      transform: rotate(-8deg);
    }
    .stamp-paid {
      border: 3px solid #0d9488;
      color: #0d9488;
      transform: rotate(-5deg);
    }
  </style>
</head>
<body class="text-slate-800 antialiased selection:bg-teal-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // =========================================================================
    // 🔥 【重要】請將下方換成你的 Firebase 設定 (只需填一次，全場手機即刻雲端秒級同步！)
    // =========================================================================
    const firebaseConfig = {
      apiKey: "請替換為你的_API_KEY",
      authDomain: "請替換為你的_PROJECT_ID.firebaseapp.com",
      projectId: "請替換為你的_PROJECT_ID",
      storageBucket: "請替換為你的_PROJECT_ID.appspot.com",
      messagingSenderId: "請替換為你的_SENDER_ID",
      appId: "請替換為你的_APP_ID"
    };

    // 檢查是否已設定 Firebase
    const isFirebaseConfigured = firebaseConfig.apiKey && !firebaseConfig.apiKey.includes("請替換");

    let db = null;
    if (isFirebaseConfigured) {
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      db = firebase.firestore();
    }

    // 菜單品項（固定定價、無自選配方）
    const MENU_ITEMS = [
      { id: 'm1', name: '炒泡麵', price: 60, desc: '經典熱銷高劑量碳水鎮定複方・大火現炒' },
      { id: 'm2', name: '炒泡麵加蛋', price: 70, desc: '招牌現炒泡麵搭配營養增效荷包蛋' },
      { id: 'm3', name: '蝶豆花漸層飲料', price: 90, desc: '秘傳蝶豆花神經舒壓特調・500ml 漸層冰飲' },
      { id: 'm4', name: '超值套餐（各一）', price: 140, desc: '炒泡麵 1 份 + 蝶豆花漸層飲料 1 杯（現折 10 元）' },
      { id: 'm5', name: '超值套餐加蛋', price: 145, desc: '炒泡麵加蛋 1 份 + 蝶豆花漸層飲料 1 杯（狂省 15 元推薦）' },
    ];

    function App() {
      const [view, setView] = useState('ORDER'); // 'ORDER', 'BOARD', 'STAFF'
      const [cart, setCart] = useState({});
      const [orders, setOrders] = useState([]);
      const [myOrderId, setMyOrderId] = useState(() => localStorage.getItem('fair115_my_order_id') || null);
      
      // 密碼彈窗控制
      const [showStaffModal, setShowStaffModal] = useState(false);
      const [passwordInput, setPasswordInput] = useState('');
      const [passwordError, setPasswordError] = useState(false);

      // 人工大聲喊號彈窗
      const [shoutOrder, setShoutOrder] = useState(null);

      // 後台重置全部二階段彈窗
      const [resetStep, setResetStep] = useState(0); // 0: 關閉, 1: 確定要重置嗎, 2: 輸入密碼
      const [resetPwdInput, setResetPwdInput] = useState('');
      const [resetError, setResetError] = useState(false);

      // 監聽雲端資料庫（有新單自動跳出、不用重新整理）
      useEffect(() => {
        if (!isFirebaseConfigured || !db) {
          // 本機 fallback
          const local = localStorage.getItem('fair115_local_orders');
          if (local) setOrders(JSON.parse(local));
          return;
        }

        const unsubscribe = db.collection("orders")
          .orderBy("createdAt", "asc")
          .onSnapshot((snapshot) => {
            const list = [];
            snapshot.forEach((doc) => {
              list.push({ id: doc.id, ...doc.data() });
            });
            setOrders(list);
          }, (err) => {
            console.error("雲端連線異常：", err);
          });

        return () => unsubscribe();
      }, []);

      // 重新渲染圖標
      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [view, orders, shoutOrder, resetStep, showStaffModal]);

      // 購物車數量變更
      const updateQty = (id, delta) => {
        setCart(prev => {
          const current = prev[id] || 0;
          const next = Math.max(0, current + delta);
          if (next === 0) {
            const copy = { ...prev };
            delete copy[id];
            return copy;
          }
          return { ...prev, [id]: next };
        });
      };

      // 計算總金額
      const cartTotal = useMemo(() => {
        return Object.entries(cart).reduce((sum, [id, qty]) => {
          const item = MENU_ITEMS.find(m => m.id === id);
          return sum + (item ? item.price * qty : 0);
        }, 0);
      }, [cart]);

      // 顧客送出掛號點餐
      const handleSubmitOrder = async () => {
        if (Object.keys(cart).length === 0) return;

        const nextNum = orders.length > 0 ? (Math.max(...orders.map(o => o.seq || 0)) + 1) : 1;
        const seqString = `#${String(nextNum).padStart(3, '0')}`;
        const items = Object.entries(cart).map(([id, qty]) => {
          const item = MENU_ITEMS.find(m => m.id === id);
          return { name: item.name, price: item.price, qty };
        });

        const newOrderData = {
          seq: nextNum,
          orderNumber: seqString,
          items,
          totalAmount: cartTotal,
          status: 'UNPAID', // UNPAID (未批價), PREPARING (製作中), READY (請取餐), COMPLETED (出院)
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          timeString: new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' })
        };

        if (isFirebaseConfigured && db) {
          const docRef = await db.collection("orders").add(newOrderData);
          setMyOrderId(docRef.id);
          localStorage.setItem('fair115_my_order_id', docRef.id);
        } else {
          const fakeId = 'local_' + Date.now();
          const localList = [...orders, { id: fakeId, ...newOrderData }];
          setOrders(localList);
          localStorage.setItem('fair115_local_orders', JSON.stringify(localList));
          setMyOrderId(fakeId);
          localStorage.setItem('fair115_my_order_id', fakeId);
        }

        setCart({});
      };

      // 店家更改訂單狀態 (雲端同步)
      const updateOrderStatus = async (orderId, newStatus) => {
        if (isFirebaseConfigured && db) {
          await db.collection("orders").doc(orderId).update({ status: newStatus });
        } else {
          const updated = orders.map(o => o.id === orderId ? { ...o, status: newStatus } : o);
          setOrders(updated);
          localStorage.setItem('fair115_local_orders', JSON.stringify(updated));
        }
      };

      // 驗證後台密碼 (115115)
      const handleVerifyStaff = (e) => {
        e.preventDefault();
        if (passwordInput === '115115') {
          setView('STAFF');
          setShowStaffModal(false);
          setPasswordInput('');
          setPasswordError(false);
        } else {
          setPasswordError(true);
          setPasswordInput('');
        }
      };

      // 驗證重置密碼 (123456)
      const handleVerifyReset = async (e) => {
        e.preventDefault();
        if (resetPwdInput === '123456') {
          if (isFirebaseConfigured && db) {
            const snap = await db.collection("orders").get();
            const batch = db.batch();
            snap.forEach(doc => batch.delete(doc.ref));
            await batch.commit();
          } else {
            localStorage.removeItem('fair115_local_orders');
            setOrders([]);
          }
          localStorage.removeItem('fair115_my_order_id');
          setMyOrderId(null);
          setResetStep(0);
          setResetPwdInput('');
          setResetError(false);
        } else {
          setResetError(true);
          setResetPwdInput('');
        }
      };

      // 當前使用者的處方箋
      const currentPatientOrder = useMemo(() => {
        return orders.find(o => o.id === myOrderId) || null;
      }, [orders, myOrderId]);

      // 統計數據
      const stats = useMemo(() => {
        const completedOrPaid = orders.filter(o => o.status !== 'UNPAID');
        const revenue = completedOrPaid.reduce((s, o) => s + (o.totalAmount || 0), 0);
        return { count: orders.length, revenue };
      }, [orders]);

      return (
        <div className="min-h-screen flex flex-col">
          {/* 未設定 Firebase 提示條 */}
          {!isFirebaseConfigured && (
            <div className="bg-amber-500 text-white text-xs sm:text-sm font-bold px-4 py-2 text-center shadow flex items-center justify-center gap-2">
              <span>⚠️ 目前處於「單機模式」（跨手機看不到單）。請將 Firebase 金鑰填入 index.html 即可啟動所有手機即時同步！</span>
            </div>
          )}

          {/* 醫院頂部橫幅 */}
          <header className="bg-slate-900 border-b-4 border-teal-600 text-white px-4 py-3 sticky top-0 z-30 shadow-md">
            <div className="max-w-4xl mx-auto flex items-center justify-between">
              <div className="flex items-center gap-2">
                <div className="w-8 h-8 rounded bg-teal-600 flex items-center justify-center font-black text-xl text-white">
                  +
                </div>
                <div>
                  <h1 className="text-base sm:text-lg font-black tracking-wide flex items-center gap-1">
                    115 精神醫療中心・炒豆花科
                  </h1>
                  <p className="text-[10px] text-teal-400 font-mono tracking-widest uppercase">
                    Clinical Hospital Department 115
                  </p>
                </div>
              </div>

              {/* 切換導覽按鈕 */}
              <div className="flex items-center gap-2">
                {view !== 'ORDER' && (
                  <button 
                    onClick={() => setView('ORDER')}
                    className="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded border border-slate-600 font-bold"
                  >
                    點餐處
                  </button>
                )}
                {view !== 'BOARD' && (
                  <button 
                    onClick={() => setView('BOARD')}
                    className="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded border border-slate-600 font-bold flex items-center gap-1 text-teal-300"
                  >
                    <span>叫號看板</span>
                  </button>
                )}
                {view !== 'STAFF' && (
                  <button 
                    onClick={() => { setShowStaffModal(true); setPasswordError(false); }}
                    className="text-xs bg-teal-600 hover:bg-teal-500 px-3 py-1.5 rounded font-bold transition shadow"
                  >
                    醫護人員入口
                  </button>
                )}
                {view === 'STAFF' && (
                  <button 
                    onClick={() => setView('ORDER')}
                    className="text-xs bg-rose-600 hover:bg-rose-500 px-3 py-1.5 rounded font-bold transition shadow"
                  >
                    🔒 鎖定離開
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* 主要視圖切換 */}
          <main className="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-6">
            
            {/* 1. 顧客門診點餐介面 */}
            {view === 'ORDER' && (
              <div className="space-y-6">
                {/* 顧客手上的處方箋 */}
                {currentPatientOrder && (
                  <div className="bg-white border-2 border-slate-300 rounded-xl shadow-lg p-5 relative overflow-hidden">
                    <div className="flex justify-between items-start border-b border-dashed border-slate-300 pb-3">
                      <div>
                        <span className="text-[11px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-bold border border-slate-200">
                          個人就診掛號聯（拿著此單到攤位）
                        </span>
                        <div className="text-4xl font-black font-mono-num text-teal-700 mt-1">
                          {currentPatientOrder.orderNumber}
                        </div>
                      </div>
                      
                      {/* 印章 */}
                      <div className="text-right">
                        {currentPatientOrder.status === 'UNPAID' && (
                          <div className="stamp-unpaid font-black text-sm px-3 py-1 border-2 uppercase">
                            【未批價付款】
                          </div>
                        )}
                        {currentPatientOrder.status === 'PREPARING' && (
                          <div className="stamp-paid font-black text-sm px-3 py-1 border-2 uppercase animate-pulse">
                            【大廚熱炒製作中】
                          </div>
                        )}
                        {currentPatientOrder.status === 'READY' && (
                          <div className="bg-emerald-500 text-white font-black text-sm px-3 py-1 rounded shadow animate-bounce uppercase">
                            📢 請到攤位取餐出院！
                          </div>
                        )}
                        {currentPatientOrder.status === 'COMPLETED' && (
                          <div className="text-slate-400 font-bold text-xs">
                            ✓ 已完成領藥出院
                          </div>
                        )}
                      </div>
                    </div>

                    <div className="py-3 text-sm space-y-1">
                      {currentPatientOrder.items.map((it, idx) => (
                        <div key={idx} className="flex justify-between text-slate-700">
                          <span>{it.name} × {it.qty}</span>
                          <span className="font-mono-num font-bold">${it.price * it.qty}</span>
                        </div>
                      ))}
                      <div className="border-t pt-2 flex justify-between font-black text-slate-900 text-base">
                        <span>批價應付總額</span>
                        <span className="text-teal-700 font-mono-num">${currentPatientOrder.totalAmount}</span>
                      </div>
                    </div>

                    {currentPatientOrder.status === 'UNPAID' && (
                      <div className="bg-amber-50 border border-amber-200 rounded p-3 text-xs text-amber-800 font-bold text-center">
                        👉 請帶著這支手機畫面至「115 攤位窗口」付現 ${currentPatientOrder.totalAmount}，主廚立即為您下鍋開炒！
                      </div>
                    )}
                  </div>
                )}

                {/* 點餐清單區塊 */}
                <div className="bg-white rounded-xl shadow border border-slate-200 overflow-hidden">
                  <div className="bg-slate-100 px-4 py-3 border-b border-slate-200 flex justify-between items-center">
                    <h2 className="font-black text-slate-800 text-base flex items-center gap-2">
                      <span>💊</span> 門診點餐清單（點擊直接增減份數）
                    </h2>
                    <span className="text-xs text-slate-500">免選配方・現點現做</span>
                  </div>

                  <div className="divide-y divide-slate-100">
                    {MENU_ITEMS.map(item => {
                      const qty = cart[item.id] || 0;
                      return (
                        <div key={item.id} className="p-4 flex items-center justify-between gap-3 hover:bg-slate-50 transition">
                          <div className="flex-1">
                            <div className="flex items-center gap-2">
                              <h3 className="font-black text-slate-900 text-base">{item.name}</h3>
                              <span className="text-teal-700 font-black font-mono-num text-lg">${item.price}</span>
                            </div>
                            <p className="text-xs text-slate-500 mt-0.5">{item.desc}</p>
                          </div>

                          <div className="flex items-center gap-2">
                            {qty > 0 && (
                              <button 
                                onClick={() => updateQty(item.id, -1)}
                                className="w-8 h-8 rounded-full bg-slate-200 text-slate-800 font-black flex items-center justify-center hover:bg-slate-300"
                              >
                                -
                              </button>
                            )}
                            {qty > 0 && (
                              <span className="w-6 text-center font-black font-mono-num text-lg">{qty}</span>
                            )}
                            <button 
                              onClick={() => updateQty(item.id, 1)}
                              className={`h-8 px-3 rounded-full font-black flex items-center justify-center transition shadow ${
                                qty > 0 ? 'bg-teal-600 text-white hover:bg-teal-700' : 'bg-slate-900 text-white hover:bg-slate-800 text-xs'
                              }`}
                            >
                              {qty > 0 ? '+' : '+ 加入'}
                            </button>
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  {/* 底部結帳欄 */}
                  {cartTotal > 0 && (
                    <div className="bg-slate-900 text-white p-4 border-t border-slate-800 flex items-center justify-between sticky bottom-0">
                      <div>
                        <div className="text-xs text-slate-400">已選餐點合計</div>
                        <div className="text-2xl font-black font-mono-num text-teal-400">${cartTotal}</div>
                      </div>
                      <button 
                        onClick={handleSubmitOrder}
                        className="bg-teal-500 hover:bg-teal-400 text-slate-950 font-black px-6 py-3 rounded-xl shadow-lg transition text-base tracking-wider"
                      >
                        送出掛號點餐 ➔
                      </button>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* 2. 叫號取餐大看板 */}
            {view === 'BOARD' && (
              <div className="space-y-4">
                <div className="bg-slate-900 text-white p-4 rounded-xl shadow text-center border-b-4 border-teal-500">
                  <h2 className="text-xl sm:text-2xl font-black tracking-wider">
                    115 現場即時叫號看板
                  </h2>
                  <p className="text-xs text-slate-400 mt-1">
                    聽到大喊號碼或看板亮綠燈，請持手機掛號聯至窗口取餐
                  </p>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  {/* 製作中 */}
                  <div className="bg-slate-800 rounded-xl p-4 border border-slate-700 text-white min-h-[300px]">
                    <div className="border-b border-slate-700 pb-2 mb-4 flex justify-between items-center">
                      <span className="font-black text-amber-400 text-lg flex items-center gap-2">
                        <span className="w-3 h-3 rounded-full bg-amber-400 animate-ping"></span>
                        大火製作中 (PREPARING)
                      </span>
                      <span className="text-xs bg-slate-700 px-2 py-0.5 rounded text-slate-300">
                        {orders.filter(o => o.status === 'PREPARING').length} 單
                      </span>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      {orders.filter(o => o.status === 'PREPARING').map(o => (
                        <div key={o.id} className="bg-slate-900 border border-amber-500/50 rounded-lg p-3 text-center">
                          <div className="text-3xl font-black font-mono-num text-amber-400">{o.orderNumber}</div>
                          <div className="text-[11px] text-slate-400 truncate mt-1">{o.items.map(i => i.name).join(', ')}</div>
                        </div>
                      ))}
                      {orders.filter(o => o.status === 'PREPARING').length === 0 && (
                        <div className="col-span-2 text-center text-slate-500 py-12 text-sm font-bold">目前無排隊製作餐點</div>
                      )}
                    </div>
                  </div>

                  {/* 請取餐 */}
                  <div className="bg-slate-800 rounded-xl p-4 border-2 border-emerald-500 text-white min-h-[300px]">
                    <div className="border-b border-slate-700 pb-2 mb-4 flex justify-between items-center">
                      <span className="font-black text-emerald-400 text-lg flex items-center gap-2">
                        <span className="w-3 h-3 rounded-full bg-emerald-400 animate-bounce"></span>
                        請出院取餐 (NOW SERVING)
                      </span>
                      <span className="text-xs bg-emerald-950 text-emerald-300 px-2 py-0.5 rounded border border-emerald-800">
                        {orders.filter(o => o.status === 'READY').length} 單等候中
                      </span>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      {orders.filter(o => o.status === 'READY').map(o => (
                        <div key={o.id} className="bg-emerald-950/80 border-2 border-emerald-400 rounded-lg p-3 text-center shadow-lg shadow-emerald-950">
                          <div className="text-4xl font-black font-mono-num text-emerald-300">{o.orderNumber}</div>
                          <div className="text-xs text-emerald-200 font-bold mt-1">請至窗口領餐</div>
                        </div>
                      ))}
                      {orders.filter(o => o.status === 'READY').length === 0 && (
                        <div className="col-span-2 text-center text-slate-500 py-12 text-sm font-bold">暫無待取餐點</div>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* 3. 醫護工作人員後台 (需密碼 115115) */}
            {view === 'STAFF' && (
              <div className="space-y-6">
                {/* 後台頂部欄位與重置按鈕 */}
                <div className="bg-slate-900 text-white p-4 rounded-xl shadow flex flex-wrap justify-between items-center gap-3">
                  <div>
                    <h2 className="text-lg font-black flex items-center gap-2">
                      <span className="text-teal-400">● 雲端即時連線中</span> 醫護出餐控制中心
                    </h2>
                    <p className="text-xs text-slate-400">
                      所有已登入此後台的裝置皆同步顯示以下訂單
                    </p>
                  </div>

                  <div className="flex items-center gap-3">
                    <div className="text-right">
                      <div className="text-xs text-slate-400">今日實收營收</div>
                      <div className="text-xl font-black font-mono-num text-teal-400">${stats.revenue}</div>
                    </div>
                    {/* 小巧重置按鈕 */}
                    <button 
                      onClick={() => setResetStep(1)}
                      className="text-[11px] text-slate-400 hover:text-rose-400 border border-slate-700 hover:border-rose-800 px-2 py-1 rounded transition"
                    >
                      重置全部
                    </button>
                  </div>
                </div>

                {/* 訂單列表 */}
                <div className="space-y-3">
                  {orders.map(order => (
                    <div 
                      key={order.id} 
                      className={`bg-white rounded-xl p-4 shadow border transition ${
                        order.status === 'UNPAID' ? 'border-l-8 border-l-rose-500' :
                        order.status === 'PREPARING' ? 'border-l-8 border-l-amber-500 bg-amber-50/20' :
                        order.status === 'READY' ? 'border-l-8 border-l-emerald-500 bg-emerald-50/30' :
                        'border-slate-200 opacity-60'
                      }`}
                    >
                      <div className="flex flex-wrap justify-between items-start gap-2">
                        <div className="flex items-center gap-2">
                          <span className="text-2xl font-black font-mono-num text-slate-900">{order.orderNumber}</span>
                          <span className="text-xs text-slate-500 font-mono">{order.timeString}</span>
                          {order.status === 'UNPAID' && (
                            <span className="text-xs bg-rose-100 text-rose-700 font-bold px-2 py-0.5 rounded">未付現</span>
                          )}
                          {order.status === 'PREPARING' && (
                            <span className="text-xs bg-amber-100 text-amber-800 font-bold px-2 py-0.5 rounded">正在現炒</span>
                          )}
                          {order.status === 'READY' && (
                            <span className="text-xs bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded">已叫號等取</span>
                          )}
                          {order.status === 'COMPLETED' && (
                            <span className="text-xs bg-slate-100 text-slate-600 font-bold px-2 py-0.5 rounded">已出院完成</span>
                          )}
                        </div>

                        <div className="text-lg font-black font-mono-num text-teal-800">
                          ${order.totalAmount}
                        </div>
                      </div>

                      {/* 餐點清單 */}
                      <div className="my-3 text-sm font-bold text-slate-800 bg-slate-50 p-2.5 rounded border border-slate-200">
                        {order.items.map((it, idx) => (
                          <div key={idx} className="flex justify-between py-0.5">
                            <span>{it.name}</span>
                            <span className="font-mono-num text-teal-900">× {it.qty}</span>
                          </div>
                        ))}
                      </div>

                      {/* 動作按鈕 */}
                      <div className="flex flex-wrap gap-2 pt-1">
                        {order.status === 'UNPAID' && (
                          <button 
                            onClick={() => updateOrderStatus(order.id, 'PREPARING')}
                            className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-black px-4 py-2 rounded-lg shadow transition flex items-center gap-1"
                          >
                            <span>💰 收到現金 ${order.totalAmount} ➔ 開火現炒</span>
                          </button>
                        )}

                        {order.status === 'PREPARING' && (
                          <button 
                            onClick={() => {
                              updateOrderStatus(order.id, 'READY');
                              setShoutOrder(order);
                            }}
                            className="bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-black px-4 py-2 rounded-lg shadow transition flex items-center gap-1"
                          >
                            <span>🔔 現炒完成 ➔ 叫號大聲喊！</span>
                          </button>
                        )}

                        {order.status === 'READY' && (
                          <>
                            <button 
                              onClick={() => setShoutOrder(order)}
                              className="bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold px-3 py-2 rounded-lg transition"
                            >
                              📢 再次大喊
                            </button>
                            <button 
                              onClick={() => updateOrderStatus(order.id, 'COMPLETED')}
                              className="bg-teal-700 hover:bg-teal-600 text-white text-xs font-black px-4 py-2 rounded-lg shadow transition"
                            >
                              ✓ 客人已取餐（完成出院）
                            </button>
                          </>
                        )}
                      </div>
                    </div>
                  ))}

                  {orders.length === 0 && (
                    <div className="bg-white rounded-xl p-12 text-center text-slate-400 font-bold border border-dashed border-slate-300">
                      目前尚無任何點餐掛號訂單
                    </div>
                  )}
                </div>
              </div>
            )}
          </main>

          {/* 📢 8XL 超大字人工大聲喊號彈窗 (顧攤同學直接扯開喉嚨喊) */}
          {shoutOrder && (
            <div className="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border-4 border-amber-400 rounded-3xl p-6 sm:p-10 max-w-lg w-full text-center text-white shadow-2xl space-y-6">
                <span className="bg-amber-400 text-slate-950 text-sm font-black px-4 py-1 rounded-full uppercase tracking-wider">
                  廚房炒好了！扯開喉嚨大喊
                </span>

                <div className="text-7xl sm:text-8xl font-black font-mono-num text-amber-400 tracking-tight animate-pulse">
                  {shoutOrder.orderNumber}
                </div>

                <div className="bg-slate-800 border border-slate-700 rounded-2xl p-4 text-left">
                  <div className="text-xs text-slate-400 mb-1 font-bold">請對著走道大聲喊：</div>
                  <div className="text-xl sm:text-2xl font-black text-teal-300">
                    「請 {shoutOrder.orderNumber.replace('#', '')} 號 取餐出院！」
                  </div>
                  <div className="mt-2 pt-2 border-t border-slate-700 text-xs text-slate-300">
                    {shoutOrder.items.map(i => `${i.name} × ${i.qty}`).join('、')}
                  </div>
                </div>

                <button 
                  onClick={() => setShoutOrder(null)}
                  className="w-full bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-lg py-4 rounded-xl shadow-lg transition"
                >
                  我喊完了！關閉視窗
                </button>
              </div>
            </div>
          )}

          {/* 後台入口密碼彈窗 (115115) */}
          {showStaffModal && (
            <div className="fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4">
                <h3 className="text-lg font-black text-slate-900 text-center">請輸入密碼</h3>
                <form onSubmit={handleVerifyStaff} className="space-y-3">
                  <input 
                    type="password"
                    autoFocus
                    placeholder="請輸入密碼"
                    value={passwordInput}
                    onChange={(e) => setPasswordInput(e.target.value)}
                    className="w-full border-2 border-slate-300 focus:border-teal-600 rounded-xl px-4 py-3 text-center text-lg font-mono tracking-widest outline-none"
                  />
                  {passwordError && (
                    <div className="text-rose-600 text-xs font-bold text-center">密碼錯誤，請重新輸入</div>
                  )}
                  <div className="flex gap-2 pt-2">
                    <button 
                      type="button"
                      onClick={() => setShowStaffModal(false)}
                      className="flex-1 bg-slate-200 text-slate-700 font-bold py-2.5 rounded-xl hover:bg-slate-300"
                    >
                      取消
                    </button>
                    <button 
                      type="submit"
                      className="flex-1 bg-teal-600 hover:bg-teal-500 text-white font-black py-2.5 rounded-xl shadow"
                    >
                      進入後台
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 後台「重置全部」二階段密碼彈窗 (123456) */}
          {resetStep > 0 && (
            <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4">
                {resetStep === 1 && (
                  <>
                    <h3 className="text-lg font-black text-slate-900 text-center text-rose-600">確定要重置嗎？</h3>
                    <p className="text-xs text-slate-600 text-center">
                      重置後將清空雲端所有點餐訂單與累計營收，號碼將重新自 #001 開始。
                    </p>
                    <div className="flex gap-2 pt-2">
                      <button 
                        onClick={() => setResetStep(0)}
                        className="flex-1 bg-slate-200 text-slate-700 font-bold py-2.5 rounded-xl hover:bg-slate-300"
                      >
                        否
                      </button>
                      <button 
                        onClick={() => setResetStep(2)}
                        className="flex-1 bg-rose-600 hover:bg-rose-500 text-white font-black py-2.5 rounded-xl shadow"
                      >
                        是
                      </button>
                    </div>
                  </>
                )}

                {resetStep === 2 && (
                  <>
                    <h3 className="text-lg font-black text-slate-900 text-center">請輸入密碼</h3>
                    <form onSubmit={handleVerifyReset} className="space-y-3">
                      <input 
                        type="password"
                        autoFocus
                        placeholder="請輸入密碼"
                        value={resetPwdInput}
                        onChange={(e) => setResetPwdInput(e.target.value)}
                        className="w-full border-2 border-slate-300 focus:border-rose-600 rounded-xl px-4 py-3 text-center text-lg font-mono tracking-widest outline-none"
                      />
                      {resetError && (
                        <div className="text-rose-600 text-xs font-bold text-center">密碼錯誤，請重新輸入</div>
                      )}
                      <div className="flex gap-2 pt-2">
                        <button 
                          type="button"
                          onClick={() => { setResetStep(0); setResetPwdInput(''); }}
                          className="flex-1 bg-slate-200 text-slate-700 font-bold py-2.5 rounded-xl hover:bg-slate-300"
                        >
                          取消
                        </button>
                        <button 
                          type="submit"
                          className="flex-1 bg-rose-600 hover:bg-rose-500 text-white font-black py-2.5 rounded-xl shadow"
                        >
                          確認清空
                        </button>
                      </div>
                    </form>
                  </>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
